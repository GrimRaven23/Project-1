# Local/dev orchestration. Secrets are NOT committed: every credential below is
# read from an env file (`.env` at this directory) or the host environment, and
# compose fails fast when they are missing. Copy `docker-compose.env.example`
# to `docker-compose.env` and fill in real values before starting.
#
# The previous version hardcoded a Postgres password and a JWT secret directly
# in this tracked file — the JWT secret is now required from the environment
# and is validated for length by the application itself in production.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: telcoqualify-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required - see docker-compose.env.example}
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      # Must be >=32 chars; the app hard-fails at boot otherwise.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required - see docker-compose.env.example}
      - STORAGE_PROVIDER=local
      - STORAGE_LOCAL_PATH=/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - telco_uploads:/app/storage/uploads
    networks:
      - telco_net

  postgres:
    image: postgres:16-alpine
    container_name: telcoqualify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - see docker-compose.env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see docker-compose.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-telcoqualify}
    ports:
      # Bound to loopback: the database must not be exposed on all interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - telco_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telco_net

  redis:
    image: redis:7-alpine
    container_name: telcoqualify-redis
    restart: unless-stopped
    ports:
      # Bound to loopback for the same reason.
      - "127.0.0.1:6379:6379"
    volumes:
      - telco_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telco_net

volumes:
  telco_db_data:
  telco_redis_data:
  telco_uploads:

networks:
  telco_net:
    driver: bridge
