name: CI Quality Gate

# The repository's GitHub default branch is `main` (verified via API); the
# local working copy had been left on a local-only `master` branch with no
# remote. `develop` does not exist and is dropped. Historically this gate
# ran 3x on `main` and failed all 3 times (missing ESLint config).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life in April 2026; 24 is the active LTS
          # and matches local development.
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Lint & Static Code Analysis
        run: npm run lint

      - name: Run Test Suites (custom business-rule + Vitest unit/integration)
        run: npm run test

      - name: Production Bundle Verification
        run: npm run build

  # Added 2026-10-23: the Dockerfile had NEVER been exercised by CI, so a
  # builder-stage `ENV NODE_ENV=development` slipped through and only surfaced
  # when the first release tag tried to build the image (it broke prerendering
  # of /404). Building the image on every push closes that gap. No registry
  # push and no secrets are involved — this is a pure build verification.
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: telcoqualify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
