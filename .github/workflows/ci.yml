name: CI Quality Gate

# NOTE: the repository's default branch is `master` (not `main`/`develop`).
# The previous triggers referenced branches that do not exist, so this gate
# never ran on any push or PR.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 reached end-of-life in April 2026; 24 is the active LTS
          # and matches local development.
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Lint & Static Code Analysis
        run: npm run lint

      - name: Run Test Suites (custom business-rule + Vitest unit/integration)
        run: npm run test

      - name: Production Bundle Verification
        run: npm run build
