name: Daily Automated Security Audit

on:
  schedule:
    # Runs at 04:00 UTC every single day
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  audit-dependencies:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 is end-of-life (April 2026); use the active LTS.
          node-version: 24
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # Genuinely gates on high/critical advisories, minus the explicitly
      # accepted entries in /.trivyignore (shared with the Trivy scan).
      # A raw `npm audit --audit-level=high` cannot express accepted risk
      # and failed on this repository for 25 consecutive days.
      - name: Run npm audit gate (accepted-risk aware)
        run: node scripts/audit-gate.mjs
